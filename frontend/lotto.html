<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOTTO 통계</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="lotto">
    <div class="container full-screen">
        <header>
            <h1>📊 LOTTO 통계</h1>
            <p>최근 당첨번호 분석을 통해 자주 나온 번호를 확인하세요.</p>
            <nav class="page-nav">
                <a class="nav-link" href="/">메인</a>
                <a class="nav-link" href="/toto">TOTO</a>
                <a class="nav-link" href="/board">게시판</a>
            </nav>
        </header>

        <main>
            <section class="analytics-section big-section">
                <div style="display:flex; gap:18px; align-items:flex-start; justify-content:center; flex-wrap:wrap;">
                    <div class="machine-card" style="flex:0 1 520px; max-width:520px">
                        <div class="machine">
                            <canvas id="canvas"></canvas>
                            <div id="tube"></div>
                            <div id="machineFallback" class="machine-fallback" aria-hidden="true">
                                <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="80" cy="80" r="78" fill="#0f172a" stroke="#1f2937" stroke-width="4"/>
                                    <g transform="translate(20,28)">
                                        <rect x="0" y="66" width="120" height="40" rx="6" fill="#111827"/>
                                        <rect x="36" y="20" width="48" height="48" rx="24" fill="#111827" stroke="#374151" stroke-width="3"/>
                                        <text x="60" y="54" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">LOTTO</text>
                                    </g>
                                </svg>
                            </div>
                        </div>

                        <div class="controls">
                            <button onclick="startDraw()">1줄 추첨</button>
                            <button onclick="fastFive()">5줄 즉시</button>
                            <button onclick="resetDraw()">초기화</button>
                        </div>

                        <div style="margin-top:12px; display:flex; gap:8px; justify-content:center; align-items:center;">
                            <input id="drwNoInput" type="number" placeholder="회차 입력 (예: 1040)" style="padding:8px; border-radius:8px; width:140px;" />
                            <button onclick="fetchLottoRoundUI()">회차 조회</button>
                            <button onclick="loadLottoHistory()">최신 조회</button>
                        </div>

                        <div id="lottoHistory" style="margin-top:12px; text-align:left;"></div>
                        <div id="result" class="result-section"></div>
                    </div>

                    <div style="flex:0 1 420px; max-width:420px;">
                        <div class="stats-grid">
                            <div class="stat-box">
                                <h3>자주 나온 번호</h3>
                                <div id="mostCommon" class="number-list"></div>
                            </div>
                            <div class="stat-box">
                                <h3>덜 나온 번호</h3>
                                <div id="leastCommon" class="number-list"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2026 로또 생성기 | LOTTO 페이지</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>

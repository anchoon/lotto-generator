<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOTTO 통계</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="lotto">
    <div class="container full-screen">
        <header>
            <h1>📊 LOTTO 통계</h1>
            <p>최근 당첨번호 분석을 통해 자주 나온 번호를 확인하세요.</p>
            <nav class="page-nav">
                <a class="nav-link" href="/">메인</a>
                <a class="nav-link" href="/toto">TOTO</a>
                <a class="nav-link" href="/board">게시판</a>
            </nav>
        </header>

        <main>
            <section class="analytics-section big-section">
                <div class="stats-grid">
                    <div class="stat-box">
                        <h3>자주 나온 번호</h3>
                        <div id="mostCommon" class="number-list"></div>
                    </div>
                    <div class="stat-box">
                        <h3>덜 나온 번호</h3>
                        <div id="leastCommon" class="number-list"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2026 로또 생성기 | LOTTO 페이지</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>

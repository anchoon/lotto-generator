<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V리그 - LIVE LOTTO DRAW</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #2D3436;
            --light: #F5F6FA;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        header {
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        nav.menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        nav.menu a {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s;
            font-weight: 500;
        }

        nav.menu a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        main {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .construction-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        h2 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .feature-list {
            background: var(--light);
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
            text-align: left;
        }

        .feature-list h3 {
            color: var(--dark);
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.1em;
        }

        .feature-list ul {
            list-style: none;
            padding: 0;
        }

        .feature-list li {
            padding: 10px 0;
            color: #666;
            border-bottom: 1px solid #ddd;
        }

        .feature-list li:last-child {
            border-bottom: none;
        }

        .feature-list li::before {
            content: "✓ ";
            color: var(--primary);
            font-weight: bold;
            margin-right: 10px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            height: 100%;
            width: 45%;
            border-radius: 10px;
        }

        .progress-text {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: white;
            font-size: 0.85em;
        }

        @media (max-width: 600px) {
            main {
                padding: 40px 20px;
            }

            header h1 {
                font-size: 1.8em;
            }

            .construction-icon {
                font-size: 3.5em;
            }

            h2 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏐 V리그</h1>
            <p>곧 서비스가 시작됩니다</p>
            <nav class="menu">
                <a href="/">홈</a>
                <a href="/world-cup">월드컵</a>
                <a href="/kbo">KBO</a>
                <a href="/kleague">K리그</a>
            </nav>
        </header>

        <main>
            <div class="construction-icon">🚧</div>
            <h2>공사 중입니다</h2>
            <p>더 나은 서비스를 제공하기 위해 V리그 페이지를 개선하고 있습니다.</p>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-text">완성도: 45%</div>

            <div class="feature-list">
                <h3>곧 추가될 기능</h3>
                <ul>
                    <li>실시간 경기 일정 및 결과</li>
                    <li>구단별 상세 정보</li>
                    <li>선수 통계 및 랭킹</li>
                    <li>경기 하이라이트</li>
                    <li>실시간 알림 및 구독</li>
                </ul>
            </div>

            <p>📧 <strong>소식 알기</strong>를 원하신다면 이메일을 남겨주세요.</p>
            <input type="email" placeholder="이메일 주소 입력" style="padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px; width: 100%; max-width: 300px; margin-bottom: 10px;">
            <br>
            <button style="background: linear-gradient(135deg, #FF6B6B, #4ECDC4); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: 600;">알림 설정</button>

            <a href="/kbo" class="cta-button">다른 스포츠 보기</a>
        </main>

        <footer>
            <p>© 2026 LIVE LOTTO DRAW | V리그 준비 중...</p>
        </footer>
    </div>
</body>
</html>

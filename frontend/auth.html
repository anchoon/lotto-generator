<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 / 로그인</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="auth">
    <div class="container">
        <header>
            <h1>🔐 회원가입 / 로그인</h1>
            <p>회원가입 후 게시판에 경기 분석과 응원글을 남겨보세요.</p>
            <nav class="page-nav">
                <a class="nav-link" href="/">일정 보기</a>
                <a class="nav-link" href="/board">게시판</a>
            </nav>
        </header>

        <main>
            <section class="auth-container">
                <div class="auth-header">
                    <h2 id="authTitle">회원가입</h2>
                    <p>아이디와 비밀번호를 입력하고 로그인 또는 회원가입을 진행하세요.</p>
                </div>

                <form id="authForm" class="auth-form">
                    <div class="form-group">
                        <label><input type="radio" name="authMode" value="signup" checked> 회원가입</label>
                        <label><input type="radio" name="authMode" value="login"> 로그인</label>
                    </div>
                    <div class="form-group">
                        <label for="username">아이디</label>
                        <input type="text" id="username" placeholder="아이디를 입력하세요">
                    </div>
                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" placeholder="비밀번호를 입력하세요">
                    </div>
                    <button class="btn-submit" id="authSubmit" type="submit">회원가입</button>
                    <p class="error-message" id="authMessage"></p>
                </form>
            </section>
        </main>

        <footer>
            <p>© 2026 한국 스포츠 일정</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>

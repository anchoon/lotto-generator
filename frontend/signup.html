<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - LIVE LOTTO DRAW</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1em;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        nav.menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        nav.menu a {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s;
            font-weight: 500;
        }

        nav.menu a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
        }

        .auth-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .auth-container > p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        .password-requirements {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 12px 15px;
            border-radius: 5px;
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        .password-requirements ul {
            margin: 5px 0 0 20px;
            list-style-type: disc;
        }

        .password-requirements li {
            margin: 3px 0;
        }

        button[type="submit"] {
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            margin-top: 10px;
        }

        .message.error {
            background: #ffe0e0;
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }

        .message.success {
            background: #e0f2e0;
            color: #1b5e20;
            border-left: 4px solid #1b5e20;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.95em;
        }

        .auth-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .auth-link a:hover {
            text-decoration: underline;
            color: #764ba2;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.85em;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 20px;
            }

            header h1 {
                font-size: 2em;
            }

            button[type="submit"] {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎰 LIVE LOTTO</h1>
            <p>회원이 되어 스포츠 정보와 게시판을 이용하세요</p>
            <nav class="menu">
                <a href="/">홈</a>
                <a href="/login">로그인</a>
                <a href="/board">게시판</a>
            </nav>
        </header>

        <main>
            <section class="auth-container">
                <h2>회원가입</h2>
                <p>새로운 계정을 만드세요</p>

                <form id="signupForm">
                    <div class="form-group">
                        <label for="username">아이디</label>
                        <input type="text" id="username" placeholder="4자 이상의 아이디 입력" required>
                    </div>

                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" placeholder="8자 이상, 대문자, 숫자 포함" required>
                        <div class="password-requirements">
                            <strong>비밀번호 요구사항:</strong>
                            <ul>
                                <li>8자 이상</li>
                                <li>대문자 최소 1개</li>
                                <li>숫자 최소 1개</li>
                            </ul>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">비밀번호 확인</label>
                        <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required>
                    </div>

                    <div class="form-group">
                        <label for="nickname">닉네임</label>
                        <input type="text" id="nickname" placeholder="2자 이상 20자 이하" required>
                    </div>

                    <button type="submit">가입 완료</button>
                    
                    <div id="message" class="message" style="display: none;"></div>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>가입 중...</p>
                    </div>
                </form>

                <div class="auth-link">
                    이미 계정이 있으신가요? <a href="/login">로그인하기</a>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2026 LIVE LOTTO DRAW | 모든 권리 보유</p>
        </footer>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const messageDiv = document.getElementById('message');
        const loadingDiv = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const nickname = document.getElementById('nickname').value.trim();

            // 유효성 검사
            if (username.length < 4) {
                showMessage('아이디는 4자 이상이어야 합니다.', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('비밀번호는 8자 이상이어야 합니다.', 'error');
                return;
            }

            if (!/[A-Z]/.test(password)) {
                showMessage('비밀번호에 대문자가 포함되어야 합니다.', 'error');
                return;
            }

            if (!/[0-9]/.test(password)) {
                showMessage('비밀번호에 숫자가 포함되어야 합니다.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('비밀번호가 일치하지 않습니다.', 'error');
                return;
            }

            if (nickname.length < 2 || nickname.length > 20) {
                showMessage('닉네임은 2자 이상 20자 이하여야 합니다.', 'error');
                return;
            }

            // 서버로 가입 요청
            loadingDiv.style.display = 'block';
            messageDiv.style.display = 'none';

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        nickname: nickname
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✓ 회원가입 완료! 로그인 페이지로 이동합니다...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showMessage(data.error || '회원가입에 실패했습니다.', 'error');
                }
            } catch (error) {
                showMessage('서버 연결에 실패했습니다.', 'error');
                console.error('Error:', error);
            } finally {
                loadingDiv.style.display = 'none';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
